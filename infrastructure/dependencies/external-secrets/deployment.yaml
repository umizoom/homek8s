---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 10m
  releaseName: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: 2.14.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace:  external-secrets
  values:
    crds:
      create: false
    resources:
      limits:
        memory: 256Mi
    certController:
      resources:
        limits:
          memory: 256Mi
    webhook:
      resources:
        limits:
          memory: 128Mi

  install:
    createNamespace: true
