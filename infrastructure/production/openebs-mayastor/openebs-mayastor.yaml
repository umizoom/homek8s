apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openebs
  namespace: openebs
spec:
  interval: 5m0s
  url: https://openebs.github.io/openebs
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: openebs
spec:
  interval: 10m          # Increased slightly to give components room to stabilize
  timeout: 15m           # CRITICAL: Gives Replicated PV engines ample time to roll over
  upgrade:
    remediation:
      retries: 3         # Allows Flux to retry automatically if it encounters API stutter
      remediateLastFailure: true
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: openebs
      version: "4.6.0"
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: openebs
      interval: 10m      # Aligned with the top-level spec interval
  values:
    localpv-provisioner:
      localpv:
        image:
          registry: quay.io/
      hostpathClass:
        name: openebs-hostpath
      helperPod:
        image:
          registry: quay.io/
    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: true
          keep: true
    zfs-localpv:
      enabled: false
    lvm-localpv:
      enabled: false
    mayastor:
      enabled: true
      csi:
        node:
          initContainers:
            enabled: false
      io_engine:
        envcontext: "iova-mode=pa"
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: true
