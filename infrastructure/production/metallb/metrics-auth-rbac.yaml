# MetalLB >= v0.16 serves /metrics over HTTPS and authenticates callers with a TokenReview
# and SubjectAccessReview. The upstream manifest does not grant these permissions, so every
# authenticated scrape fails with a 500.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metallb-system:metrics-auth
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metallb-system:metrics-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metallb-system:metrics-auth
subjects:
  - kind: ServiceAccount
    name: speaker
    namespace: metallb-system
  - kind: ServiceAccount
    name: controller
    namespace: metallb-system
