apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-reaper
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-reaper
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pod-reaper
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: pod-reaper-sa
      containers:
        - env:
            - name: inCluster
              value: "true"
            - name: TIMEZONE
              value: "EST"
            - name: WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: alertmanager-discord
                  key: webhook_url
                  optional: true
          image: ghcr.io/umizoom/pod-reaper:latest@sha256:7ad7ac511bbaeb7fc4869b429ab1618636baff4ce454dc2f7fc6ec5c7cd62255
          ports:
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          resources:
            limits:
              memory: 256Mi
          name: pod-reaper
      restartPolicy: Always
