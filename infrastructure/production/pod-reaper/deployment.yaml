apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-reaper
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-reaper
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pod-reaper
    spec:
      serviceAccountName: pod-reaper-sa
      containers:
        - env:
            - name: inCluster
              value: "true"
            - name: TIMEZONE
              value: "EST"
          image: ghcr.io/umizoom/pod-reaper:latest@sha256:9bd6be7ba063af2a2b6af0598dbee2d899e525a30b9916ae70aa4026e602ac14
          resources:
            limits:
              memory: 256Mi
          name: pod-reaper
      restartPolicy: Always
