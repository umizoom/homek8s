apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-reaper
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-reaper
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pod-reaper
    spec:
      serviceAccountName: pod-reaper-sa
      containers:
        - env:
            - name: inCluster
              value: "true"
            - name: TIMEZONE
              value: "EST"
          image: ghcr.io/umizoom/pod-reaper:latest@sha256:9623d7dec806d77b906a0ef8f84a169c5a77a0cb04beaad64e364e2bd3353b6e
          resources:
            limits:
              memory: 256Mi
          name: pod-reaper
      restartPolicy: Always
