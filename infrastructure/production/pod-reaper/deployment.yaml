apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-reaper
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-reaper
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pod-reaper
    spec:
      serviceAccountName: pod-reaper-sa
      containers:
        - env:
            - name: inCluster
              value: "true"
            - name: TIMEZONE
              value: "EST"
          image: ghcr.io/umizoom/pod-reaper:latest@sha256:c0502888729ae53c9ca2ccc06646ad8262d92a83311ea34f3c7c6c42208e349b
          resources:
            limits:
              memory: 256Mi
          name: pod-reaper
      restartPolicy: Always
