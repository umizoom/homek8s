apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-discord-webhook
  namespace: flux-system
spec:
  target:
    name: flux-discord-webhook
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        address: |-
          {{ .password }}
  data:
    - secretKey: password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: 153f8ed9-9e0a-4076-a798-b4ed0101fe45
        property: password
