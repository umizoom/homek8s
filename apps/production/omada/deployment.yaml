apiVersion: apps/v1
kind: Deployment
metadata:
  name: omada
  labels:
    app: omada
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omada
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: omada
    spec:
      containers:
        # https://github.com/mbentley/docker-omada-controller
        # Must match the version of the controller being migrated from.
        - name: omada
          image: mbentley/omada-controller:5.15.24.19
          env:
            - name: TZ
              value: America/New_York
            - name: MANAGE_HTTP_PORT
              value: "8088"
            - name: MANAGE_HTTPS_PORT
              value: "8043"
            - name: PORTAL_HTTP_PORT
              value: "8088"
            - name: PORTAL_HTTPS_PORT
              value: "8843"
          ports:
            - {name: manage-https, containerPort: 8043, protocol: TCP}
            - {name: manage-http, containerPort: 8088, protocol: TCP}
            - {name: portal-https, containerPort: 8843, protocol: TCP}
            - {name: discovery, containerPort: 29810, protocol: UDP}
            - {name: manager-v1, containerPort: 29811, protocol: TCP}
            - {name: adopt-v1, containerPort: 29812, protocol: TCP}
            - {name: upgrade-v1, containerPort: 29813, protocol: TCP}
            - {name: manager-v2, containerPort: 29814, protocol: TCP}
            - {name: transfer-v2, containerPort: 29815, protocol: TCP}
            - {name: rtty, containerPort: 29816, protocol: TCP}
            - {name: eap-discovery, containerPort: 19810, protocol: UDP}
            - {name: app-discovery, containerPort: 27001, protocol: UDP}
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 3Gi
          startupProbe:
            tcpSocket:
              port: manage-https
            periodSeconds: 10
            failureThreshold: 36
          livenessProbe:
            tcpSocket:
              port: manage-https
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /opt/tplink/EAPController/data
            - name: logs
              mountPath: /opt/tplink/EAPController/logs
            - name: work
              mountPath: /opt/tplink/EAPController/work
      restartPolicy: Always
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: omada-data
        - name: logs
          emptyDir: {}
        - name: work
          emptyDir: {}
