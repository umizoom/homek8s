apiVersion: v1
kind: Service
metadata:
  name: omada
  labels:
    app: omada
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.2.21
  # Single replica; Local keeps the AP source IPs visible to the controller.
  externalTrafficPolicy: Local
  selector:
    app: omada
  ports:
    - {name: manage-https, port: 8043, targetPort: 8043, protocol: TCP}
    - {name: manage-http, port: 8088, targetPort: 8088, protocol: TCP}
    - {name: portal-https, port: 8843, targetPort: 8843, protocol: TCP}
    - {name: manager-v1, port: 29811, targetPort: 29811, protocol: TCP}
    - {name: adopt-v1, port: 29812, targetPort: 29812, protocol: TCP}
    - {name: upgrade-v1, port: 29813, targetPort: 29813, protocol: TCP}
    - {name: manager-v2, port: 29814, targetPort: 29814, protocol: TCP}
    - {name: transfer-v2, port: 29815, targetPort: 29815, protocol: TCP}
    - {name: rtty, port: 29816, targetPort: 29816, protocol: TCP}
    # Migrated APs send their discovery packets to the controller's web port
    # (the port given to the migration wizard), so answer UDP 8043 with the
    # discovery listener.
    - {name: migrate-discovery-udp, port: 8043, targetPort: 29810, protocol: UDP}
    - {name: discovery-udp, port: 29810, targetPort: 29810, protocol: UDP}
    - {name: eap-discovery-udp, port: 19810, targetPort: 19810, protocol: UDP}
    - {name: app-discovery-udp, port: 27001, targetPort: 27001, protocol: UDP}
