apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garmin-boostcamp-sync-external
  namespace: default
spec:
  target:
    name: garmin-boostcamp-sync-external
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        GARMIN_EMAIL: |-
          {{ .GARMIN_EMAIL }}
        GARMIN_PASSWORD: |-
          {{ .GARMIN_PASSWORD }}
        BOOSTCAMP_EMAIL: |-
          {{ .BOOSTCAMP_EMAIL }}
        BOOSTCAMP_PASSWORD: |-
          {{ .BOOSTCAMP_PASSWORD }}
        DISCORD_WEBHOOK_URL: |-
          {{ .DISCORD_WEBHOOK_URL }}
  data:
    - secretKey: GARMIN_EMAIL
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: 1e8ab08b-bc43-480e-b2c1-b4fc001b4432
        property: username
    - secretKey: GARMIN_PASSWORD
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: 1e8ab08b-bc43-480e-b2c1-b4fc001b4432
        property: password
    - secretKey: BOOSTCAMP_EMAIL
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: 89384eb1-c99f-4b16-9bc0-b4fc001b7924
        property: username
    - secretKey: BOOSTCAMP_PASSWORD
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: 89384eb1-c99f-4b16-9bc0-b4fc001b7924
        property: password
    - secretKey: DISCORD_WEBHOOK_URL
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: 153f8ed9-9e0a-4076-a798-b4ed0101fe45
        property: password
