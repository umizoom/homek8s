apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord
  namespace: default
spec:
  target:
    name: alertmanager-discord
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        webhook_url: |-
          {{ .password }}
  data:
    - secretKey: password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: 153f8ed9-9e0a-4076-a798-b4ed0101fe45
        property: password
