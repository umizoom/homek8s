---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: default
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus
      version: 29.40.1
      sourceRef:
        kind: HelmRepository
        name: prometheus
        namespace: default
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    alertmanager:
      resources:
        limits:
          memory: 128Mi
      configmapReload:
        resources:
          limits:
            memory: 64Mi
      enabled: true
      image:
        # chart default (v0.27.0) has no webhook_url_file for Discord; added in v0.28.1
        tag: v0.28.1
      # silences reset when the pod restarts; acceptable until alerting has proven itself
      persistence:
        enabled: false
      extraSecretMounts:
        - name: discord-webhook
          mountPath: /etc/alertmanager-secrets/discord
          secretName: alertmanager-discord
          readOnly: true
      config:
        route:
          receiver: discord
          group_by: [alertname, namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 24h
        receivers:
          - name: discord
            discord_configs:
              - webhook_url_file: /etc/alertmanager-secrets/discord/webhook_url
                send_resolved: true
        inhibit_rules:
          # a node that is down explains the pod alerts on it
          - source_matchers:
              - alertname = NodeNotReady
            target_matchers:
              - severity = warning
            equal: [node]
    kube-state-metrics:
      resources:
        limits:
          memory: 256Mi
    prometheus-node-exporter:
      resources:
        limits:
          memory: 128Mi
    prometheus-pushgateway:
      resources:
        limits:
          memory: 128Mi
    configmapReload:
      prometheus:
        resources:
          limits:
            memory: 64Mi
    server:
      resources:
        limits:
          memory: 3Gi
      persistentVolume:
        existingClaim: "prometheus-server-claim"
        storageClass: "replicated-storage"
        size: 15Gi
    serverFiles:
      alerting_rules.yml:
        groups:
          - name: nodes
            rules:
              - alert: NodeNotReady
                expr: kube_node_status_condition{condition="Ready",status="true"} == 0
                for: 2m
                labels:
                  severity: critical
                annotations:
                  summary: "Node {{ $labels.node }} is not Ready"
                  description: "Node {{ $labels.node }} has been NotReady for more than 2 minutes."
              - alert: ControlPlaneQuorumRisk
                expr: sum(kube_node_status_condition{condition="Ready",status="true"}) < 2
                for: 1m
                labels:
                  severity: critical
                annotations:
                  summary: "Fewer than 2 nodes are Ready"
                  description: "All 3 nodes are control-plane members, so losing a second node puts etcd quorum at risk. Ready nodes: {{ $value }}."
              - alert: NodeExporterDown
                expr: up{app_kubernetes_io_name="prometheus-node-exporter"} == 0
                for: 2m
                labels:
                  severity: warning
                annotations:
                  summary: "node-exporter on {{ $labels.node }} is down"
                  description: "Prometheus cannot scrape node-exporter on {{ $labels.node }}, so node metrics and node alerts are blind."
              - alert: NodeHighMemory
                expr: 1 - (node_memory_MemAvailable_bytes{app_kubernetes_io_name="prometheus-node-exporter"} / node_memory_MemTotal_bytes{app_kubernetes_io_name="prometheus-node-exporter"}) > 0.9
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "Node {{ $labels.node }} memory above 90%"
                  description: "Memory usage on {{ $labels.node }} is {{ $value | humanizePercentage }} for 15 minutes."
              - alert: NodeHighCPU
                expr: 1 - avg by (node) (rate(node_cpu_seconds_total{mode="idle",app_kubernetes_io_name="prometheus-node-exporter"}[5m])) > 0.9
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "Node {{ $labels.node }} CPU above 90%"
                  description: "CPU usage on {{ $labels.node }} is {{ $value | humanizePercentage }} for 15 minutes."
              - alert: NodeDiskLow
                expr: node_filesystem_avail_bytes{mountpoint="/var",app_kubernetes_io_name="prometheus-node-exporter"} / node_filesystem_size_bytes{mountpoint="/var",app_kubernetes_io_name="prometheus-node-exporter"} < 0.10
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "Node {{ $labels.node }} has less than 10% free on /var"
                  description: "/var on {{ $labels.node }} has {{ $value | humanizePercentage }} free. /var holds container images, logs and local volumes."
          - name: pods
            rules:
              - alert: PodCrashLooping
                expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "{{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
                  description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} has been in CrashLoopBackOff for 5 minutes."
              # Completed job pods (k8up backups) are phase Succeeded, so they are not matched.
              # The join adds the node label so NodeNotReady can suppress these.
              - alert: PodNotReady
                expr: |
                  (
                    (kube_pod_status_phase{phase=~"Pending|Unknown"} == 1)
                    or on (namespace, pod)
                    (kube_pod_status_ready{condition="false"} == 1 and on (namespace, pod) kube_pod_status_phase{phase="Running"} == 1)
                  ) * on (namespace, pod) group_left (node) kube_pod_info
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "{{ $labels.namespace }}/{{ $labels.pod }} not ready"
                  description: "{{ $labels.namespace }}/{{ $labels.pod }} on {{ $labels.node }} has been Pending, Unknown or not Ready for 15 minutes."
              - alert: ContainerOOMKilled
                expr: |
                  kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
                  and on (namespace, pod, container)
                  increase(kube_pod_container_status_restarts_total[10m]) > 0
                labels:
                  severity: warning
                annotations:
                  summary: "{{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled"
                  description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} was killed for exceeding its memory limit and restarted."
          - name: backups
            rules:
              - alert: K8upBackupErrors
                expr: k8up_backup_restic_last_errors > 0
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "Backup of {{ $labels.pvc }} had errors"
                  description: "The last restic backup of {{ $labels.pvc }} reported {{ $value }} errors. The k8up job can still show Succeeded, so those files may be missing from the backup."
              - alert: K8upNoRecentBackup
                expr: time() - push_time_seconds{job="restic_backup"} > 36 * 3600
                for: 10m
                labels:
                  severity: critical
                annotations:
                  summary: "No backup has completed in over 36 hours"
                  description: "The backup schedule runs daily, but the last backup finished {{ $value | humanizeDuration }} ago. If the pushgateway restarted, this alert stays silent until the next backup pushes metrics again."
              - alert: K8upJobFailed
                expr: increase(k8up_jobs_failed_counter[30m]) > 0
                labels:
                  severity: warning
                annotations:
                  summary: "k8up {{ $labels.jobType }} job failed"
                  description: "A k8up {{ $labels.jobType }} job failed in namespace {{ $labels.namespace }} within the last 30 minutes."
              - alert: K8upScheduledJobFailing
                expr: k8up_schedule_last_job_succeeded == 0
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "Last k8up {{ $labels.jobType }} for {{ $labels.schedule }} did not succeed"
                  description: "The most recent {{ $labels.jobType }} run of schedule {{ $labels.schedule }} failed."
          - name: storage
            rules:
              # media-pvc is a 50 TiB NFS share where a percentage is meaningless, and the openebs/*
              # volumes live on the node disk, which NodeDiskLow already covers.
              - alert: PVCAlmostFull
                expr: |
                  (kubelet_volume_stats_available_bytes{namespace!="openebs",persistentvolumeclaim!="media-pvc"} / kubelet_volume_stats_capacity_bytes{namespace!="openebs",persistentvolumeclaim!="media-pvc"} < 0.15)
                  and
                  (kubelet_volume_stats_available_bytes{namespace!="openebs",persistentvolumeclaim!="media-pvc"} / kubelet_volume_stats_capacity_bytes{namespace!="openebs",persistentvolumeclaim!="media-pvc"} >= 0.05)
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} below 15% free"
                  description: "{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has {{ $value | humanizePercentage }} free space."
              - alert: PVCFull
                expr: kubelet_volume_stats_available_bytes{namespace!="openebs",persistentvolumeclaim!="media-pvc"} / kubelet_volume_stats_capacity_bytes{namespace!="openebs",persistentvolumeclaim!="media-pvc"} < 0.05
                for: 15m
                labels:
                  severity: critical
                annotations:
                  summary: "{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} below 5% free"
                  description: "{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has {{ $value | humanizePercentage }} free space. Writes will start failing."
              - alert: MayastorNodeOffline
                expr: mayastor_node_online == 0
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "Mayastor node {{ $labels.node_id }} is offline"
                  description: "Replicated storage on {{ $labels.node_id }} is offline, so volumes have fewer replicas."
              - alert: MayastorPoolNotOnline
                expr: diskpool_status != 1
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "Mayastor pool {{ $labels.name }} is not online"
                  description: "Disk pool {{ $labels.name }} on {{ $labels.node }} reports status {{ $value }} (1 = online, 2 = degraded, 3 = faulted)."
              - alert: MayastorPoolAlmostFull
                expr: diskpool_used_size_bytes / diskpool_total_size_bytes > 0.85
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: "Mayastor pool {{ $labels.name }} above 85% used"
                  description: "Disk pool {{ $labels.name }} is {{ $value | humanizePercentage }} full."
          - name: external-targets
            rules:
              - alert: ScrapeTargetDown
                expr: up{job=~"unraid-cadvisor|unraid-nodeexporter|opnsense-nodeexporter|mayastor|k8up|metallb"} == 0
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
                  description: "Prometheus cannot scrape {{ $labels.job }} at {{ $labels.instance }}. For unraid and opnsense this usually means the host (backup storage, router) is down."
              # The 1h delay rides out the Unraid backup/mover stopping the container.
              # hotio holds qBittorrent back until PIA hands out a forwarded port, so a failed
              # port forward (or a dead VPN) shows up as the WebUI not listening.
              - alert: QbittorrentWebUIDown
                expr: probe_success{job="qbittorrent-webui"} == 0
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: "qBittorrent WebUI is unreachable"
                  description: "{{ $labels.instance }} has not accepted connections for 1 hour. The container does not start qBittorrent until PIA provides a forwarded port, so check `docker logs qbittorrent` on Unraid for \"[PIA] Forwarded port request failed\" and try another VPN_PIA_PREFERRED_REGION."
              - alert: HomeAssistantDown
                expr: probe_success{job="homeassistant-web"} == 0
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: "Home Assistant is unreachable"
                  description: "{{ $labels.instance }} has not returned a 2xx response for 1 hour."
              - alert: NginxProxyDown
                expr: probe_success{job="nginx-proxy"} == 0
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: "{{ $labels.proxy }} is unreachable"
                  description: "{{ $labels.proxy }} ({{ $labels.instance }}) has not accepted connections for 1 hour. These run as containers on Unraid, so check `docker ps` and `docker logs` there."
    extraScrapeConfigs: |
      - job_name: unraid-cadvisor
        scrape_interval: 5s
        static_configs:
          - targets:
            - 192.168.1.27:8081
      - job_name: unraid-nodeexporter
        scrape_interval: 5s
        static_configs:
          - targets:
            - 192.168.1.27:9100
      - job_name: qbittorrent-webui
        scrape_interval: 30s
        metrics_path: /probe
        params:
          module: [tcp_connect]
        static_configs:
          - targets:
            - 192.168.1.27:8080
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.default.svc:9115
      - job_name: homeassistant-web
        scrape_interval: 30s
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
            - https://ha.lab.umaidabbasi.com/home/overview
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.default.svc:9115
      - job_name: nginx-proxy
        scrape_interval: 30s
        metrics_path: /probe
        params:
          module: [tcp_connect]
        static_configs:
          - targets:
            - 192.168.1.5:443
            labels:
              proxy: NginxProxyManager (LAN)
          - targets:
            - 192.168.11.5:443
            labels:
              proxy: NginxProxyManagerDMZ (DMZ)
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.default.svc:9115
      - job_name: opnsense-nodeexporter
        scrape_interval: 5s
        static_configs:
          - targets:
            - 192.168.1.1:9100
      - job_name: mayastor
        scrape_interval: 5s
        static_configs:
          - targets:
            - 192.168.2.2:9502
            - 192.168.2.3:9502
            - 192.168.2.4:9502
      # MetalLB >= v0.16 serves metrics over HTTPS with a self-signed cert and requires a
      # bearer token. The pods' prometheus.io/scrape annotation is disabled in
      # infrastructure/production/metallb so the generic kubernetes-pods job skips them.
      - job_name: metallb
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [metallb-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metricshttps
          - source_labels: [__meta_kubernetes_pod_label_component]
            target_label: component
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
      - job_name: k8up
        scrape_interval: 5s
        static_configs:
          - targets:
            - k8up-metrics:8080
      - job_name: unpackerr
        scrape_interval: 1m
        static_configs:
          - targets: ["unpackerr.default.svc.cluster.local:5656"]
