---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: default
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus
      version: 25.30.2
      sourceRef:
        kind: HelmRepository
        name: prometheus
        namespace: default
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    alertmanager:
      enabled: true
      image:
        # chart default (v0.27.0) has no webhook_url_file for Discord; added in v0.28.1
        tag: v0.28.1
      # silences reset when the pod restarts; acceptable until alerting has proven itself
      persistence:
        enabled: false
      extraSecretMounts:
        - name: discord-webhook
          mountPath: /etc/alertmanager-secrets/discord
          secretName: alertmanager-discord
          readOnly: true
      config:
        route:
          receiver: discord
          group_by: [alertname, namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
        receivers:
          - name: discord
            discord_configs:
              - webhook_url_file: /etc/alertmanager-secrets/discord/webhook_url
                send_resolved: true
        inhibit_rules:
          # a node that is down explains the pod alerts on it
          - source_matchers:
              - alertname = NodeNotReady
            target_matchers:
              - severity = warning
            equal: [node]
    server:
      persistentVolume:
        existingClaim: "prometheus-server-claim"
        storageClass: "replicated-storage"
        size: 10Gi
    extraScrapeConfigs: |
      - job_name: unraid-cadvisor
        scrape_interval: 5s
        static_configs:
          - targets:
            - 192.168.1.27:8081
      - job_name: unraid-nodeexporter
        scrape_interval: 5s
        static_configs:
          - targets:
            - 192.168.1.27:9100
      - job_name: opnsense-nodeexporter
        scrape_interval: 5s
        static_configs:
          - targets:
            - 192.168.1.1:9100
      - job_name: mayastor
        scrape_interval: 5s
        static_configs:
          - targets:
            - 192.168.2.2:9502
            - 192.168.2.3:9502
            - 192.168.2.4:9502
      - job_name: k8up
        scrape_interval: 5s
        static_configs:
          - targets:
            - k8up-metrics:8080
      - job_name: unpackerr
        scrape_interval: 1m
        static_configs:
          - targets: ["unpackerr.default.svc.cluster.local:5656"]
