version: '3'

vars:
  CONTROL_PLANE_IP: 192.168.2.2
  WORKER_IP: 192.168.2.2
  TALOS_CONFIG: "talos/talosconfig.yaml"

tasks:
  # generate_config:
  #   desc: Generate configuration files
  #   cmds:
  #     - talosctl gen config homecluster "https://${CONTROL_PLANE_IP}:6443" --output-dir {{._out_dir}} --force

  apply_controlplane_config:
    desc: "Apply configuration to control plane node (usage: task talos:apply_controlplane_config CONTROL_PLANE_CONFIG=talos/control-1.yaml)"
    requires:
      vars: [CONTROL_PLANE_CONFIG]
    cmd: |
      sops --decrypt "{{.CONTROL_PLANE_CONFIG}}" | \
      talosctl apply-config --insecure --nodes "{{.CONTROL_PLANE_IP}}" --file /dev/stdin

  apply_worker_config:
    desc: "Apply configuration to worker node (usage: task talos:apply_worker_config WORKER_CONFIG=talos/worker.yaml)"
    requires:
      vars: [WORKER_CONFIG]
    cmd: |
      sops --decrypt "{{.WORKER_CONFIG}}" | \
      talosctl apply-config --insecure --nodes "{{.WORKER_IP}}" --file /dev/stdin

  # setup_talos_config:
  #   desc: Set up Talos configuration
  #   env:
  #     TALOSCONFIG: '{{.talosconfig}}'
  #   cmds:
  #     - talosctl config endpoint "{{.CONTROL_PLANE_IP}}"
  #     - talosctl config node "{{.CONTROL_PLANE_IP}}"
  #     - talosctl --talosconfig "${TALOSCONFIG}" config endpoint "{{.CONTROL_PLANE_IP}}"
  #     - talosctl --talosconfig "${TALOSCONFIG}" config node "{{.CONTROL_PLANE_IP}}"

  bootstrap_talos:
    desc: Bootstrap Talos
    cmd: |
      sops --decrypt "{{.TALOS_CONFIG}}" | \
      talosctl --talosconfig /dev/stdin bootstrap

  get_kubeconfig:
    desc: Get kubeconfig
    cmd: |
      sops --decrypt "{{.TALOS_CONFIG}}" | \
      talosctl --talosconfig /dev/stdin kubeconfig

  upgrade:
    desc: "Bump the installer image in the machine configs and roll the Talos upgrade across the control plane (usage: task talos:upgrade VERSION=v1.14.2)"
    requires:
      vars: [VERSION]
    env:
      TALOSCONFIG: /tmp/talosconfig.yaml
    cmds:
      - ./scripts/talos-set-version.sh "{{.VERSION}}"
      - task: den
      - ansible-playbook hacking/ansible/talos-upgrade.yaml -i hacking/ansible/hosts.yaml -e talos_version="v{{.VERSION | trimPrefix "v"}}"

  upgrade_dry_run:
    desc: "Show what talos:upgrade would do without changing configs or nodes (usage: task talos:upgrade_dry_run VERSION=v1.14.2)"
    requires:
      vars: [VERSION]
    env:
      TALOSCONFIG: /tmp/talosconfig.yaml
      DRY_RUN: "1"
    cmds:
      - ./scripts/talos-set-version.sh "{{.VERSION}}"
      - task: den
      - ansible-playbook hacking/ansible/talos-upgrade.yaml -i hacking/ansible/hosts.yaml --check -e talos_version="v{{.VERSION | trimPrefix "v"}}"

  k8s_version_dry_run:
    desc: "Show which Kubernetes image tags k8s_version would change (usage: task talos:k8s_version_dry_run VERSION=1.37.2)"
    requires:
      vars: [VERSION]
    env:
      DRY_RUN: "1"
    cmd: ./scripts/k8s-set-version.sh "{{.VERSION}}"

  k8s_version:
    desc: "Bump the Kubernetes image tags in the machine configs without decrypting them (usage: task talos:k8s_version VERSION=1.37.2)"
    requires:
      vars: [VERSION]
    cmd: ./scripts/k8s-set-version.sh "{{.VERSION}}"

  renew:
    desc: Re-mint the talosconfig admin client cert (expires after 1 year) and re-encrypt talos/talosconfig.yaml
    cmd: ./scripts/talos-renew-config.sh

  renew_dry_run:
    desc: Test talos:renew end to end (decrypt, mint, verify against the node) without changing any repo files
    env:
      DRY_RUN: "1"
    cmd: ./scripts/talos-renew-config.sh

  den:
    desc: Decrypt config, place into /tmp
    cmds:
       - sops --decrypt --output-type yaml "{{.TALOS_CONFIG}}" > /tmp/talosconfig.yaml
      #  - sops --decrypt --output-type yaml "{{.CONTROL_PLANE_CONFIG}}" > /tmp/controlplane.yaml
      #  - sops --decrypt --output-type yaml "{{.WORKER_CONFIG}}" > /tmp/worker.yaml
